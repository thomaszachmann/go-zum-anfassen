apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app.kubernetes.io/name: web}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: web}}
  template:
    metadata: {labels: {app.kubernetes.io/name: web}}
    spec:
      initContainers:
      - name: migrate
        image: registry.local:5000/migrate
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 64Mi}
      containers:
      - name: web
        image: nginx:latest
        resources:
          requests: {cpu: 100m}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app.kubernetes.io/name: web}
  ports: [{port: 80}]
