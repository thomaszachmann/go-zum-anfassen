# GoReleaser-Konfiguration für urlcheck – prüfen mit: goreleaser check
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: urlcheck
    main: ./cmd/urlcheck
    binary: urlcheck
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproduzierbare Builds

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]
